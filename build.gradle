buildscript {
    ext.kotlin_version = '2.2.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Gradle
        classpath 'com.android.tools.build:gradle:9.4.1'

        // Kotlin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    // SemVer (`major.minor.patch`).
    ext.versionName = '2.0.4'

    repositories {
        google()
        mavenCentral()
    }
}
