buildscript {
    ext.kotlin_version = '2.2.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Gradle
        classpath 'com.android.tools.build:gradle:9.3.2'

        // Kotlin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    ext.versionCode = 194

    repositories {
        google()
        mavenCentral()
    }
}
