import java.text.SimpleDateFormat
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'org.thecosmicfrog.luasataglance'

    compileSdk = 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
        }
    }

    defaultConfig {
        applicationId "org.thecosmicfrog.luasataglance"
        minSdk 31
        targetSdk 37
        versionCode generateVersionCode()
        versionName generateVersionName()
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        debug {
            resValue "string", "version_code", generateVersionCode().toString()
            resValue "string", "version_name", generateVersionName()
            resValue "string", "release_date", generateReleaseDate()

            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            resValue "string", "version_name", generateVersionName()
            resValue "string", "release_date", generateReleaseDate()

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            /*
             * MapLibre ships libmaplibre.so for four ABIs. No consumer devices are x86, so the release keeps only the ARM copies to
             * reduce APK size. Debug still ships x86, so the emulator keeps working.
             */
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    flavorDimensions "api"
    productFlavors {
        mock {
            dimension "api"
            applicationIdSuffix ".mock"
            buildConfigField "boolean", "MOCK_API", "true"
        }
        prod {
            dimension "api"
            buildConfigField "boolean", "MOCK_API", "false"
        }
    }

    testOptions {
        unitTests {
            /* Robolectric needs the merged resources, or dimens and string arrays are not visible to a test. */
            includeAndroidResources = true

            all {
                /*
                 * Robolectric reaches into OpenJDK internals that the JVM seals off from Java 17 on.
                 * https://robolectric.org/getting-started/#running-with-java-17-and-higher
                 */
                jvmArgs(
                        '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.util=ALL-UNNAMED',
                        '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-opens=java.base/java.net=ALL-UNNAMED',
                        '--add-opens=java.base/java.security=ALL-UNNAMED',
                        '--add-opens=java.base/java.text=ALL-UNNAMED',
                        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                        '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                        '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
                )

                testLogging {
                    events "passed", "skipped", "failed"
                }
            }
        }
    }
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    api 'androidx.appcompat:appcompat:1.8.0'
    api 'androidx.cardview:cardview:1.0.0'
    api 'com.google.android.material:material:1.14.0'
    api 'androidx.legacy:legacy-support-v4:1.0.0'
    api 'org.maplibre.gl:android-sdk:13.5.1'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation "androidx.core:core-ktx:1.19.0"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    /* Only for WebSettingsCompat.setAlgorithmicDarkeningAllowed, which darkens the luas.ie page in AlertsFragment. */
    implementation 'androidx.webkit:webkit:1.17.0'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    /* Local unit tests. These run on the JVM, so no device or emulator is involved. */
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17-beta-4'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'com.google.truth:truth:1.4.5'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
}

private Integer generateVersionCode() {
    project.versionCode
}

private String generateVersionName() {
    String.format("0.%s", Integer.toString(generateVersionCode()))
}

private static String generateReleaseDate() {
    Date currentDate = new Date()
    SimpleDateFormat dateFormat = new SimpleDateFormat("dd MMMM yyyy", Locale.getDefault())
    String currentDateFormatted = dateFormat.format(currentDate)

    currentDateFormatted
}
